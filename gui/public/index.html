<!DOCTYPE html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>羽笔 Federstift · AI 小说创作台</title>
<style>
:root{
  --bg:#14121a; --panel:#1c1826; --panel2:#242033; --panel3:#2c2740;
  --border:#332c4a; --border2:#443c63;
  --text:#ece7f6; --muted:#9a91b8; --dim:#6f6790;
  --accent:#d9a962; --accent-soft:#3a2f1e; --accent-line:#8a6a35;
  --green:#7fc98a; --red:#e07070; --yellow:#d9b45f; --blue:#7aa7e0;
  --chip-g-bg:#16221a; --chip-y-bg:#221e12; --chip-r-bg:#221414; --chip-b-bg:#141c26; --chip-a-bg:#221c12;
  --chip-g-bd:#2f4a34; --chip-y-bd:#4a4023; --chip-r-bd:#4a2626; --chip-b-bd:#24344a; --chip-a-bd:#4a3a22;
  --sev-e-bg:#2a1414; --sev-w-bg:#241f10; --sev-i-bg:#131c26;
  --sev-e-bd:#4a2626; --sev-w-bd:#4a4023; --sev-i-bd:#24344a;
  --pending-bg:linear-gradient(180deg,#241d12,#1c1826);
  --live-bg:linear-gradient(180deg,#231c10,#191426);
  --overlay-bg:rgba(10,8,16,.62);
  --body-text:#e6e0ee; --seg-text:#e3ddec; --plan-text:#ddd6ea; --md-text:#e3ddec;
  --live-seg-text:#d8d1e6; --live-text:#e9e2f2;
  --logo-grad:linear-gradient(135deg,#3a2f1e,#5a4526);
  --primary-grad:linear-gradient(135deg,#b98a44,#d9a962);
  --radius:12px; --radius-s:8px;
  --font:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;
  --mono:'Cascadia Code','Consolas','JetBrains Mono',monospace;
}
/* 浅色主题：html[data-theme='light'] 覆盖同一套变量，其余样式无需改动 */
[data-theme='light']{
  --bg:#f6f3ec; --panel:#ffffff; --panel2:#f1ede4; --panel3:#e9e3d6;
  --border:#e0d8c8; --border2:#c8bda4;
  --text:#2c261f; --muted:#6f6758; --dim:#99907f;
  --accent:#97682a; --accent-soft:#f4ead4; --accent-line:#b0833a;
  --green:#2e7d3c; --red:#c04a4a; --yellow:#8a6a1f; --blue:#3c6ea8;
  --chip-g-bg:#e6f2e8; --chip-y-bg:#f7eed4; --chip-r-bg:#f9e4e4; --chip-b-bg:#e4edf8; --chip-a-bg:#f6ebd3;
  --chip-g-bd:#bfd8c4; --chip-y-bd:#dccb94; --chip-r-bd:#e2b4b4; --chip-b-bd:#b7cde7; --chip-a-bd:#dcc390;
  --sev-e-bg:#fae7e7; --sev-w-bg:#f8efd8; --sev-i-bg:#e5eef9;
  --sev-e-bd:#e4b6b6; --sev-w-bd:#dccb94; --sev-i-bd:#b7cde7;
  --pending-bg:linear-gradient(180deg,#faf3e2,#ffffff);
  --live-bg:linear-gradient(180deg,#fbf5e6,#ffffff);
  --overlay-bg:rgba(60,54,70,.4);
  --body-text:#3a342c; --seg-text:#3a342c; --plan-text:#3a342c; --md-text:#3a342c;
  --live-seg-text:#4a443a; --live-text:#2c261f;
  --logo-grad:linear-gradient(135deg,#d9b87e,#b98a44);
  --primary-grad:linear-gradient(135deg,#b98a44,#d9a962);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.7;overflow:hidden}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-s);padding:9px 12px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--accent-line)}
textarea{resize:vertical;line-height:1.8}
::placeholder{color:var(--dim)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
#app{display:flex;height:100%}
#sidebar{width:228px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:6px 10px 16px}
.logo-mark{width:38px;height:38px;flex:none;border-radius:10px;background:var(--logo-grad);border:1px solid var(--accent-line);display:flex;align-items:center;justify-content:center;font-size:20px}
.logo-name{font-size:16px;font-weight:700;letter-spacing:.5px}
.logo-sub{font-size:11px;color:var(--dim)}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-s);color:var(--muted);cursor:pointer;border:1px solid transparent;font-size:14px}
.nav-item:hover{background:var(--panel2);color:var(--text)}
.nav-item.active{background:var(--panel3);color:var(--text);border-color:var(--border2)}
.nav-item .ico{width:20px;text-align:center;flex:none}
.theme-toggle{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-s);border:1px solid var(--border2);background:var(--panel2);color:var(--muted);font-size:14px;cursor:pointer;transition:filter .15s;text-align:left}
.theme-toggle:hover{color:var(--text);filter:brightness(1.12)}
.theme-toggle .ico{width:20px;text-align:center;flex:none}
#sidebar .spacer{flex:1}
#side-status{padding:10px 12px;border-top:1px solid var(--border);font-size:12px;color:var(--dim);line-height:1.9}
#side-status b{color:var(--muted);font-weight:600}
#main{flex:1;overflow-y:auto;position:relative}
.page{max-width:1080px;margin:0 auto;padding:28px 32px 80px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-title{font-size:24px;font-weight:700;letter-spacing:.5px}
.page-sub{color:var(--muted);font-size:13px;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:var(--radius-s);border:1px solid var(--border2);background:var(--panel2);color:var(--text);font-size:14px;transition:filter .15s}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:var(--primary-grad);border-color:#a67c3c;color:#1c1508;font-weight:600}
.btn.ghost{background:transparent;border-color:var(--border2);color:var(--muted)}
.btn.ghost:hover{color:var(--text)}
.btn.danger{background:transparent;border-color:#5a2c2c;color:var(--red)}
.btn.small{padding:5px 11px;font-size:12.5px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.card + .card{margin-top:14px}
.card-title{font-size:15px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.novel-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s}
.novel-card:hover{border-color:var(--border2)}
.novel-title{font-size:16px;font-weight:700}
.novel-req{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:14px;color:var(--dim);font-size:12px;flex-wrap:wrap}
.meta b{color:var(--muted);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--border2);color:var(--muted);background:var(--panel2)}
.chip.green{color:var(--green);border-color:var(--chip-g-bd);background:var(--chip-g-bg)}
.chip.yellow{color:var(--yellow);border-color:var(--chip-y-bd);background:var(--chip-y-bg)}
.chip.red{color:var(--red);border-color:var(--chip-r-bd);background:var(--chip-r-bg)}
.chip.blue{color:var(--blue);border-color:var(--chip-b-bd);background:var(--chip-b-bg)}
.chip.accent{color:var(--accent);border-color:var(--chip-a-bd);background:var(--chip-a-bg)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field .hint{font-size:11.5px;color:var(--dim);margin-top:4px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row > *{flex:1;min-width:140px}
.check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:6px}
.check-item{display:flex;gap:8px;align-items:flex-start;background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-s);padding:8px 11px;cursor:pointer;font-size:13px}
.check-item:hover{border-color:var(--border2)}
.check-item input{margin-top:4px;width:auto;accent-color:var(--accent)}
.check-item .ci-name{font-weight:600}
.check-item .ci-sub{color:var(--dim);font-size:11.5px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{padding:9px 16px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font-size:14px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.empty{padding:44px 20px;text-align:center;color:var(--dim)}
.empty .big{font-size:38px;margin-bottom:10px}
#toast{position:fixed;top:20px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast-item{background:var(--panel3);border:1px solid var(--border2);border-left:3px solid var(--blue);border-radius:var(--radius-s);padding:11px 16px;max-width:420px;box-shadow:0 8px 30px rgba(0,0,0,.45);animation:toastIn .2s ease}
.toast-item.err{border-left-color:var(--red)}
.toast-item.ok{border-left-color:var(--green)}
@keyframes toastIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
#overlay{position:fixed;inset:0;background:var(--overlay-bg);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;backdrop-filter:blur(3px)}
#overlay.hidden{display:none}
#overlay .spin{width:44px;height:44px;border-radius:50%;border:3px solid var(--border2);border-top-color:var(--accent);animation:spin .9s linear infinite}
#overlay .ov-text{color:var(--muted);font-size:14px}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---- session ---- */
.sess-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 0 14px;border-bottom:1px solid var(--border);margin-bottom:18px}
.sess-title{font-size:20px;font-weight:700}
.sess-meta{display:flex;gap:8px;flex-wrap:wrap}
.sess-controls{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sess-controls select{width:auto;padding:6px 10px;font-size:12.5px}
/* ---- 创作台（全屏会话页） ---- */
body.session-mode #sidebar{display:none}
body.session-mode #main{width:100%}
.live-area{border:1px solid var(--accent-line);background:var(--live-bg);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
.live-area.hidden{display:none}
.live-head{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--accent);font-weight:600;margin-bottom:10px;flex-wrap:wrap}
.live-head .chip{font-weight:400}
.live-body{max-height:48vh;overflow-y:auto;padding-right:2px}
.live-seg{margin-bottom:12px}
.live-seg-head{font-size:11px;color:var(--dim);margin-bottom:4px}
.live-seg-text{white-space:pre-wrap;font-size:14px;line-height:1.9;color:var(--live-seg-text);opacity:.85}
.live-text{white-space:pre-wrap;font-size:14.5px;line-height:1.9;color:var(--live-text)}
.live-cursor{display:inline-block;width:2px;height:1em;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.live-log{margin-top:10px;padding-top:8px;border-top:1px dashed var(--border);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.live-log .ll{color:var(--muted)}
.live-log .ll.plan{color:var(--accent)}
.live-log .ll.review{color:var(--blue)}
.pending{border:1px solid var(--accent-line);background:var(--pending-bg);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px}
.pending-title{font-size:15px;font-weight:700;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.pending-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.text-view{background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-s);padding:14px 16px;white-space:pre-wrap;max-height:360px;overflow-y:auto;font-size:14.5px;line-height:1.9;color:var(--body-text)}
.q-item{margin-bottom:12px}
.q-item label{font-size:13px;color:var(--muted);display:block;margin-bottom:5px}
.q-item label b{color:var(--text)}
.sess-layout{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
@media(max-width:980px){.sess-layout{grid-template-columns:1fr}}
.panel-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.panel-box h3{font-size:13.5px;color:var(--muted);margin-bottom:10px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:7px;justify-content:space-between}
.seg{background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-s);padding:13px 15px;margin-bottom:10px}
.seg-head{font-size:11.5px;color:var(--dim);margin-bottom:5px;display:flex;gap:8px;align-items:center}
.seg-text{white-space:pre-wrap;font-size:14px;color:var(--seg-text);line-height:1.9}
.ch-head{font-size:16px;font-weight:700;margin:18px 0 8px;padding-top:14px;border-top:1px dashed var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.log-item{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:12.5px}
.log-item .lt{color:var(--dim);flex:none;font-family:var(--mono);font-size:11px;padding-top:2px}
.log-item .lm{color:var(--muted);overflow-wrap:anywhere}
.log-item.plan .lm{color:var(--accent)}
.log-item.review .lm{color:var(--blue)}
.log-item.feedback .lm{color:var(--green)}
.log-item.error .lm{color:var(--red)}
.log-item.note .lm{color:var(--yellow)}
.score-line{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.score-pill{background:var(--panel3);border:1px solid var(--border2);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--muted)}
.score-pill b{color:var(--text)}
.issue{border:1px solid var(--border);border-radius:var(--radius-s);padding:10px 13px;margin-top:8px;background:var(--panel2)}
.issue .sev{font-size:11px;padding:1px 8px;border-radius:99px;margin-right:8px}
.sev.error{background:var(--sev-e-bg);color:var(--red);border:1px solid var(--sev-e-bd)}
.sev.warning{background:var(--sev-w-bg);color:var(--yellow);border:1px solid var(--sev-w-bd)}
.sev.info{background:var(--sev-i-bg);color:var(--blue);border:1px solid var(--sev-i-bd)}
.issue .idim{color:var(--accent);font-size:12px;margin-left:6px}
.issue .isug{color:var(--dim);font-size:12.5px;margin-top:3px;padding-left:4px}
.plan-block{white-space:pre-wrap;color:var(--plan-text);font-size:13.5px;line-height:1.9}
.plan-ch{margin:8px 0;padding:10px 14px;background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-s);font-size:13px}
.plan-ch .pc-title{font-weight:700;color:var(--text)}
.plan-ch .pc-goal{color:var(--muted)}
.plan-ch .pc-beat{color:var(--dim);font-size:12px}
.kb-toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.kb-toolbar .spacer{flex:1}
.kb-entry{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-s);padding:13px 16px;margin-bottom:10px}
.kb-entry .ke-main{flex:1;min-width:0}
.kb-entry .ke-name{font-weight:700;font-size:14.5px}
.kb-entry .ke-desc{color:var(--muted);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
.kb-entry .ke-rules{color:var(--dim);font-size:12px;margin-top:4px}
.kb-entry .ke-actions{display:flex;gap:6px;flex:none}
.form-card{background:var(--panel);border:1px solid var(--accent-line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
.form-card .fc-title{font-size:15px;font-weight:700;color:var(--accent);margin-bottom:14px}
.fact-cand{display:flex;gap:8px;align-items:flex-start;background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-s);padding:8px 11px;margin-top:6px;font-size:13px}
.fact-cand input{margin-top:4px;width:auto;accent-color:var(--accent)}
.prov-card{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;margin-bottom:10px;cursor:pointer}
.prov-card.active{border-color:var(--accent-line);background:var(--panel2)}
.prov-card .pc-radio{width:auto;accent-color:var(--accent)}
.prov-card .pc-name{font-weight:700}
.prov-card .pc-sub{color:var(--dim);font-size:12px}
.badge-ok{color:var(--green)}
.markdown-view{white-space:pre-wrap;font-size:14px;color:var(--md-text);line-height:2}
.guide h2{font-size:19px;margin:26px 0 10px;color:var(--text)}
.guide h2:first-child{margin-top:0}
.guide p,.guide li{color:var(--muted);font-size:14px;margin-bottom:8px}
.guide ul{padding-left:22px}
.guide code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:1px 7px;font-family:var(--mono);font-size:12.5px;color:var(--accent)}
.divider{height:1px;background:var(--border);margin:16px 0}
</style>
</head><body>
<div id='app'>
  <aside id='sidebar'>
    <div class='logo'><div class='logo-mark'>🖋</div><div><div class='logo-name'>羽笔 Federstift</div><div class='logo-sub' id='logo-ver'>AI 小说创作台</div></div></div>
    <div class='nav-item' data-nav='works'><span class='ico'>📚</span>我的作品</div>
    <div class='nav-item' data-nav='new'><span class='ico'>✍</span>开始创作</div>
    <div class='nav-item' data-nav='kb'><span class='ico'>🗂</span>知识库</div>
    <div class='nav-item' data-nav='settings'><span class='ico'>⚙</span>模型与设置</div>
    <div class='nav-item' data-nav='guide'><span class='ico'>📖</span>使用说明</div>
    <div class='theme-toggle' title='切换深浅色'><span class='ico tt-ico'>🌙</span><span class='tt-label'>深色</span></div>
    <div class='spacer'></div>
    <div id='side-status'>载入中…</div>
  </aside>
  <main id='main'></main>
</div>
<div id='toast'></div>
<div id='overlay' class='hidden'><div class='spin'></div><div class='ov-text' id='ov-text'>处理中…</div></div>
<script>
'use strict';
/* ================= 工具 ================= */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
function esc(s){return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtTime(iso){if(!iso)return '';const d=new Date(iso);const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
async function api(path, opts){
  opts = opts || {};
  const init = {method: opts.method || 'GET', headers: {'Content-Type':'application/json'}};
  if (opts.body !== undefined) init.body = JSON.stringify(opts.body);
  const res = await fetch(path, init);
  let data = {};
  try { data = await res.json(); } catch(e) {}
  if (!res.ok) throw new Error(data.error || ('请求失败 (' + res.status + ')'));
  return data;
}
function toast(msg, kind){
  const box = $('#toast');
  const el = document.createElement('div');
  el.className = 'toast-item ' + (kind || '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 320); }, 3600);
}
function overlay(text){
  const o = $('#overlay');
  if (text) { $('#ov-text').textContent = text; o.classList.remove('hidden'); }
  else o.classList.add('hidden');
}
function busy(fn, msg){ return async function(...args){ overlay(msg || '处理中…'); try { return await fn.apply(this, args); } catch(e) { toast(e.message, 'err'); } finally { overlay(null); } }; }

/* 待决面板事件绑定（paintSession 之后调用） */
function bindPending(){
  const s = G.snapshot;
  const p = s && s.pending;
  if (!p) return;
  const dec = (forKind, action, extra, msg) => busy(async () => {
    const resolved = {};
    for (const k in (extra || {})) resolved[k] = typeof extra[k] === 'function' ? extra[k]() : extra[k];
    const body = { for: forKind, action: action, ...resolved };
    const d = await api('/api/session/' + encodeURIComponent(sessionId) + '/decide', { method:'POST', body });
    G.snapshot = d.snapshot; autoStreamNext = true; paintSession();
  }, msg || '处理中…');
  if (p.kind === 'questions') {
    const collect = () => $$('.q-input').map(i => ({ question: i.dataset.q, answer: i.value.trim() }));
    const submit = busy(async () => { const d = await api('/api/session/' + encodeURIComponent(sessionId) + '/answer', { method:'POST', body:{ answers: collect() } }); G.snapshot = d.snapshot; autoStreamNext = true; paintSession(); }, '保存答复…');
    $('#q-submit').onclick = submit;
    $('#q-skip').onclick = submit;
    return;
  }
  if (p.kind === 'segment') {
    $('#seg-approve').onclick = dec('segment','approve');
    $('#seg-edit').onclick = () => { const b = $('#seg-edit-box'); b.style.display = b.style.display === 'none' ? 'block' : 'none'; };
    $('#seg-edit-cancel').onclick = () => { $('#seg-edit-box').style.display = 'none'; };
    $('#seg-edit-ok').onclick = dec('segment','edit',{ editedText: () => $('#seg-edit-ta').value });
    $('#seg-redo').onclick = dec('segment','redo',null,'重写中…');
    $('#seg-back').onclick = dec('segment','back');
    $('#seg-stop').onclick = dec('segment','stop');
    return;
  }
  if (p.kind === 'chapter') {
    $('#ch-approve').onclick = dec('chapter','approve');
    $('#ch-redo').onclick = dec('chapter','redo',null,'整章重写中…');
    $('#ch-stop').onclick = dec('chapter','stop');
    return;
  }
  if (p.kind === 'review') {
    $('#rev-redo').onclick = dec('review','redo',null,'重写本章…');
    $('#rev-ignore').onclick = dec('review','ignore');
    $('#rev-strict-ok').onclick = dec('review','strictness',{ strictness: () => $('#rev-strict').value });
    return;
  }
  if (p.kind === 'chapter_done') {
    $('#cd-continue').onclick = dec('chapter_done','continue',null,'创作中…');
    $('#cd-stop').onclick = dec('chapter_done','stop');
  }
}

    extractCands = d.candidates;
    $('#ext-cands').innerHTML = `<div style="font-size:12.5px;color:var(--muted);margin:8px 0 4px">识别到 ${extractCands.length} 条候选：</div>` + extractCands.map((c,i) => `<label class="fact-cand"><input type="checkbox" data-ei="${i}" checked><span><b>${esc(c.name)}</b> <span class="chip accent" style="font-size:11px">${esc(c.category)}</span><br>${esc(c.content)}</span></label>`).join('') || '<div class="hint">没有识别出候选。</div>';
    $('#ext-save-wrap').style.display = extractCands.length ? 'flex' : 'none';
  });
  $('#ext-save').onclick = busy(async () => {
    let n = 0;
    for (let i = 0; i < extractCands.length; i++) {
      const cb = $(`[data-ei="${i}"]`); if (!cb || !cb.checked) continue;
      const c = extractCands[i];
      await api('/api/kb/settings', { method:'POST', body:{ name: c.name, category: c.category, content: c.content, facts: c.facts, aliases: c.aliases, source: 'extracted' } });
      n++;
    }
    toast('已保存 ' + n + ' 条设定', 'ok'); extractCands = []; renderKb();
  });
  $$('[data-edit]', box).forEach(b => b.onclick = () => {
    const e = entries.find(x => x.id === b.dataset.edit); if (!e) return;
    settingEditId = e.id; renderKbSettingsTab();
    $('#set-name').value = e.name; $('#set-content').value = e.content;
    $('#set-cat').value = e.category || 'other'; $('#set-aliases').value = (e.aliases||[]).join('，');
    $('#set-tags').value = (e.tags||[]).join('，');
    factCands = e.facts || [];
    $('#set-facts').innerHTML = `<div style="font-size:12.5px;color:var(--muted);margin:8px 0 4px">硬性事实：</div>` + factCands.map((f,i) => `<label class="fact-cand"><input type="checkbox" data-fi="${i}" checked><span>${esc(f)}</span></label>`).join('');
    $('#set-cancel').style.display = '';
  });
  $$('[data-del]', box).forEach(b => b.onclick = busy(async () => {
    if (!confirm('确定删除这条设定吗？')) return;
    await api('/api/kb/settings/' + b.dataset.del, { method:'DELETE' }); toast('已删除', 'ok'); renderKb();
  }));
}
/* ---- 模板库 ---- */
let tplEditId = null;
async function renderTemplatesTab(){
  const box = $('#kb-content');
  const entries = await loadKb('templates');
  box.innerHTML = `<div class="form-card"><div class="fc-title">${tplEditId ? '编辑模板' : '创建提问模板'}</div>` +
    `<div class="field"><label>模板名</label><input id="tp-name" placeholder="例如：人物小传"></div>` +
    `<div class="field"><label>用途</label><input id="tp-purpose" placeholder="例如：请 AI 帮我梳理一个角色"></div>` +
    `<div class="field"><label>模板正文（可用 {变量} 占位）</label><textarea id="tp-prompt" rows="4" placeholder="请为 {人物} 写一段小传，包括性格、动机与过往。"></textarea></div>` +
    `<div class="field"><label>标签（逗号分隔）</label><input id="tp-tags" placeholder="人物、设定"></div>` +
    `<div class="pending-actions"><button class="btn primary" id="tp-save">${tplEditId ? '保存修改' : '保存模板'}</button><button class="btn ghost" id="tp-cancel" style="display:${tplEditId?'':'none'}">取消编辑</button></div></div>` +
    `<div style="margin-top:6px">` + (entries.length ? entries.map(e => entryRow(e, 'templates', e.purpose, e.prompt)).join('') : '<div class="empty">模板库还是空的。保存常用的提问模板，之后可直接复用。</div>') + '</div>';
  $('#tp-save').onclick = busy(async () => {
    const name = $('#tp-name').value.trim(); const prompt = $('#tp-prompt').value.trim();
    if (!name || !prompt) { toast('模板名与正文不能为空', 'err'); return; }
    const body = { id: tplEditId || undefined, name, purpose: $('#tp-purpose').value.trim(), prompt, tags: $('#tp-tags').value.split(/[,，]/).map(x => x.trim()).filter(Boolean) };
    await api('/api/kb/templates', { method:'POST', body });
    tplEditId = null; toast('模板已保存', 'ok'); renderKb();
  });
  $('#tp-cancel').onclick = () => { tplEditId = null; renderKb(); };
  $$('[data-edit]', box).forEach(b => b.onclick = () => {
    const e = entries.find(x => x.id === b.dataset.edit); if (!e) return;
    tplEditId = e.id; renderTemplatesTab();
    $('#tp-name').value = e.name; $('#tp-purpose').value = e.purpose || ''; $('#tp-prompt').value = e.prompt;
    $('#tp-tags').value = (e.tags||[]).join('，');
  });
  $$('[data-del]', box).forEach(b => b.onclick = busy(async () => {
    if (!confirm('确定删除这个模板吗？')) return;
    await api('/api/kb/templates/' + b.dataset.del, { method:'DELETE' }); toast('已删除', 'ok'); renderKb();
  }));
}
/* ---- 反馈学习 ---- */
let fbCands = []; let fbRecordCount = 0;
function renderFeedbackTab(){
  const box = $('#kb-content');
  box.innerHTML = `<div class="panel-box"><h3><span>反馈学习</span><span class="chip accent">从你的修改中提炼偏好</span></h3>` +
    `<div style="font-size:13px;color:var(--muted)">创作时选择「修改这段」，你的修改会被记录到 workspace/feedback/。之后可在这里提炼成风格规则——AI 会越来越像你。</div>` +
    `<div class="pending-actions" style="margin-top:12px"><button class="btn primary" id="fb-analyze">分析我的修改</button><label class="chip" style="cursor:pointer"><input type="checkbox" id="fb-llm" checked> 用 AI 辅助分析</label></div>` +
    `<div id="fb-result"></div></div>`;
  $('#fb-analyze').onclick = busy(async () => {
    const d = await api('/api/feedback/analyze', { method:'POST', body:{ useLlm: $('#fb-llm').checked } });
    fbCands = d.candidates || []; fbRecordCount = d.records || 0;
    if (!fbRecordCount) { $('#fb-result').innerHTML = '<div class="empty">暂无可学习的修改记录。<br><span style="font-size:12px">创作时对段落点「修改」，反馈会被自动记录。</span></div>'; return; }
    if (!fbCands.length) { $('#fb-result').innerHTML = '<div class="empty">没有提炼出足够明确的偏好（修改可能偏内容而非风格）。<br><span style="font-size:12px">继续创作，积累更多修改后再来。</span></div>'; return; }
    const styles = await loadKb('styles');
    $('#fb-result').innerHTML = `<div style="font-size:12.5px;color:var(--muted);margin:10px 0 6px">基于 ${fbRecordCount} 条修改记录，提炼出 ${fbCands.length} 条候选偏好：</div>` +
      fbCands.map((c,i) => `<label class="fact-cand"><input type="checkbox" data-fbi="${i}" checked><span><b>[${Math.round(c.confidence*100)}%]</b> ${esc(c.rule)}<br><span style="color:var(--dim);font-size:12px">依据：${esc(c.reason)}</span></span></label>`).join('') +
      `<div class="row" style="margin-top:12px"><div class="field"><label>写入哪里</label><select id="fb-target"><option value="">新建风格</option>${styles.map(s => `<option value="${s.id}">追加到「${esc(s.name)}」</option>`).join('')}</select></div><div class="field"><label>新风格名（选新建时）</label><input id="fb-name" placeholder="从反馈中学习"></div></div>` +
      `<div class="pending-actions"><button class="btn primary" id="fb-apply">应用并写入风格库</button></div>`;
    $('#fb-apply').onclick = busy(async () => {
      const indexes = fbCands.map((_,i) => i).filter(i => { const cb = $(`[data-fbi="${i}"]`); return cb && cb.checked; });
      const targetStyleId = $('#fb-target').value || null;
      const newStyleName = $('#fb-name').value.trim() || '从反馈中学习';
      const d = await api('/api/feedback/apply', { method:'POST', body:{ indexes, candidates: fbCands, targetStyleId, newStyleName } });
      toast('已更新风格库：' + d.style.name + '（新增 ' + d.appliedCount + ' 条规则，学习 ' + d.learned + ' 条记录）', 'ok');
      fbCands = []; renderKb();
    });
  }, '分析中…');
}
/* ================= 设置 ================= */
async function renderSettings(){
  await refreshState(); updateSidebar();
  const cfg = G.state.config;
  const active = cfg.providers.find(p => p.id === cfg.activeProviderId);
  $('#main').innerHTML = `<div class="page"><div class="page-head"><div><div class="page-title">模型与设置</div><div class="page-sub">配置模型与偏好。密钥只保存在本地。</div></div></div>` +
    `<div class="panel-box"><h3><span>API 供应商</span><span class="chip">演示模式无需任何配置</span></h3>` +
    cfg.providers.map(p => `<label class="prov-card ${p.id===cfg.activeProviderId?'active':''}"><input type="radio" name="prov" class="pc-radio" value="${p.id}" ${p.id===cfg.activeProviderId?'checked':''}><span style="flex:1"><div class="pc-name">${esc(p.name)}</div><div class="pc-sub">${p.hasKey ? '<span class="badge-ok">✔ 已配置</span> · ' : '未配置密钥 · '}模型 ${esc(p.model || '未填')}${p.baseUrl ? ' · ' + esc(p.baseUrl) : ''}</div></span></label>`).join('') +
    `<div id="prov-fields" class="card" style="margin-top:12px"></div></div>` +
    `<div class="panel-box"><h3><span>全局偏好</span></h3>` +
    `<div class="row"><div class="field"><label>默认审批模式</label><select id="g-mode">${['auto','segment','chapter'].map(m => `<option value="${m}" ${m===cfg.approvalMode?'selected':''}>${MODE_LABEL[m]}</option>`).join('')}</select></div><div class="field"><label>每 N 章宏观一致性检查</label><input id="g-macro" type="number" min="1" max="100" value="${cfg.macroCheckInterval}"></div></div>` +
    `<div class="row"><div class="field"><label>默认审查重点（可留空）</label><input id="g-focus" value="${esc(cfg.reviewFocus)}" placeholder="如：设定一致性、人物动机"></div><div class="field"><label>默认审查力度</label><select id="g-strict">${['standard','strict','lenient'].map(x => `<option value="${x}" ${x===cfg.reviewStrictness?'selected':''}>${STRNESS[x]}</option>`).join('')}</select></div></div>` +
    `<div class="row"><div class="field"><label><input type="checkbox" id="g-rag" style="width:auto" ${cfg.rag.enabled?'checked':''}> 启用深度 RAG（设定一致性检索）</label></div><div class="field"><label>RAG 每类检索条数 topK</label><input id="g-topk" type="number" min="1" max="20" value="${cfg.rag.topK}"></div></div>` +
    `<div class="field"><label>总规划 Agent 系统提示词 <span style="color:var(--muted)">（留空使用内置默认）</span></label><textarea id="g-planner" rows="6" placeholder="留空使用内置默认提示词">${esc(cfg.plannerSystemPrompt || '')}</textarea><div class="pending-actions" style="margin-top:6px"><button class="btn small" id="g-planner-reset" type="button">恢复默认</button></div></div>` +
    `<div class="field"><label>创作 Agent 系统提示词 <span style="color:var(--muted)">（留空使用内置默认）</span></label><textarea id="g-writer" rows="6" placeholder="留空使用内置默认提示词">${esc(cfg.writerSystemPrompt || '')}</textarea><div class="pending-actions" style="margin-top:6px"><button class="btn small" id="g-writer-reset" type="button">恢复默认</button></div></div>` +
    `<div class="pending-actions"><button class="btn primary" id="g-save">保存全局偏好</button></div></div>` +
    `<div class="panel-box"><h3><span>数据与隐私</span></h3><div style="font-size:13px;color:var(--muted);line-height:2">作品与设置全部保存在本地 workspace/ 目录，均为普通文件，不联网上传。</div></div></div>`;
  const renderProvFields = () => {
    const p = cfg.providers.find(x => x.id === document.querySelector('input[name=prov]:checked')?.value);
    if (!p || p.id === 'demo') { $('#prov-fields').innerHTML = '<div style="color:var(--muted);font-size:13px">演示模式：无需密钥即可体验完整流程。</div>'; return; }
    $('#prov-fields').innerHTML = `<div class="field"><label>API Key（${p.hasKey ? '已配置，留空保持不变' : '未配置'}）</label><input id="p-key" type="password" placeholder="sk-..."></div>` +
      (p.id === 'custom' ? `<div class="field"><label>接口地址（OpenAI 兼容，不含 /chat/completions）</label><input id="p-base" value="${esc(p.baseUrl)}" placeholder="https://your-api.example.com/v1"></div>` : '') +
      `<div class="field"><label>模型名</label><input id="p-model" value="${esc(p.model)}"></div>` +
      `<div class="pending-actions"><button class="btn primary" id="p-save">保存并切换</button></div>`;
    $('#p-save').onclick = busy(async () => {
      await api('/api/config/provider', { method:'POST', body:{ providerId: p.id, apiKey: $('#p-key').value.trim() || undefined, model: $('#p-model').value.trim() || undefined, baseUrl: p.id === 'custom' ? $('#p-base').value.trim() : undefined } });
      toast('已保存' + ($('#p-key').value.trim() ? '并切换' : ''), 'ok'); renderSettings();
    });
  };
  renderProvFields();
  $$('input[name=prov]').forEach(r => r.onchange = renderProvFields);
  $('#g-planner-reset').onclick = () => { $('#g-planner').value = ''; toast('已恢复为内置默认提示词（保存后生效）', 'ok'); };
  $('#g-writer-reset').onclick = () => { $('#g-writer').value = ''; toast('已恢复为内置默认提示词（保存后生效）', 'ok'); };
  $('#g-save').onclick = busy(async () => {
    await api('/api/config/general', { method:'POST', body:{ approvalMode: $('#g-mode').value, macroCheckInterval: parseInt($('#g-macro').value,10), reviewFocus: $('#g-focus').value, reviewStrictness: $('#g-strict').value, plannerSystemPrompt: $('#g-planner').value, writerSystemPrompt: $('#g-writer').value, rag: { enabled: $('#g-rag').checked, topK: parseInt($('#g-topk').value,10) } } });
    toast('全局偏好已保存', 'ok'); renderSettings();
  });
}
/* ================= 使用说明 ================= */
function renderGuide(){
  $('#main').innerHTML = `<div class="page guide"><div class="page-head"><div><div class="page-title">使用说明</div><div class="page-sub">快速上手，一分钟开写。</div></div></div>` +
  `<h2>1. 开始创作</h2><p>在「开始创作」输入故事要求，点击开始。规划、写作、审查都会在创作台实时显示。默认演示模式无需任何配置。</p>` +
  `<h2>2. 审批模式</h2><p><b>自动</b>：生成即采纳；<b>逐段</b>：每段确认；<b>逐章</b>：章末确认。创作中可随时切换。</p>` +
  `<h2>3. 审查</h2><p>章节与宏观一致性自动检查。逐段/逐章模式下由你决定：重写本章、忽略或调整下次力度；自动模式按规则自动裁决（发现问题即自动重写，最多 1 次，不打断写作）。</p>` +
  `<h2>4. 知识库</h2><ul><li><b>风格库</b>：粘贴范例自动提炼写作规则；</li><li><b>设定库</b>：对话式创建或自动提取；</li><li><b>模板库</b>：保存常用提问模板；</li><li><b>反馈学习</b>：你的修改会自动沉淀为风格偏好。</li></ul>` +
  `<h2>5. 数据</h2><p>作品与知识库全部保存在本项目的 <code>workspace/</code> 目录，本地文件，不上传。</p>` +
  `<h2>6. 配置模型</h2><p>在「模型与设置」填入 API Key 与模型名即可使用真实模型创作。</p></div>`;
}
/* ================= 启动 ================= */
(async function init(){
  try { await refreshState(); updateSidebar(); } catch(e) {}
  route();
})();
</script>
</body>
